services:
  app:
    build: .
    container_name: jadwal-mengajar
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - app_data:/data
    # Tanpa Caddy (akses langsung http://IP-SERVER:3000), hapus tanda # di bawah:
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"

  # Reverse proxy + HTTPS otomatis (Let's Encrypt). Ganti domain di Caddyfile.
  caddy:
    image: caddy:2
    container_name: jadwal-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
